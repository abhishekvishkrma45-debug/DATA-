<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akash Service Store - Auto UPI Gateway</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #f0f2f5; padding: 15px; }

    header { background: #007bff; color: white; padding: 15px 20px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .wallet-box { background: #138496; padding: 8px 15px; border-radius: 20px; font-weight: bold; }

    .main-container { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); text-align: center; }
    .card h3 { color: #333; margin-bottom: 15px; border-bottom: 2px solid #007bff; padding-bottom: 5px; text-align: left; }

    label { display: block; font-size: 13px; font-weight: bold; color: #555; margin-top: 10px; text-align: left; }
    input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; outline: none; }

    .btn { width: 100%; margin-top: 15px; padding: 12px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; color: white; }
    .btn-buy { background: #28a745; }
    .btn-add { background: #007bff; }

    .upi-badge { background: #e9ecef; padding: 8px; border-radius: 6px; font-size: 13px; font-weight: bold; margin-bottom: 10px; color: #333; }
    #qr-modal { display: none; margin-top: 15px; padding: 10px; border: 1px dashed #007bff; border-radius: 8px; background: #f8f9fa; }
    #qr-modal img { width: 180px; height: 180px; }
  </style>
</head>
<body>

  <header>
    <h2>Akash Service Store</h2>
    <div class="wallet-box">Balance: ₹<span id="user-balance">0</span></div>
  </header>

  <div class="main-container">

    <!-- Add Balance Gateway Card -->
    <div class="card">
      <h3>💳 Add Balance (Auto Gateway)</h3>
      <div class="upi-badge">UPI: rameshchandra908080@okaxis</div>

      <label>Mobile Number</label>
      <input type="number" id="add-mobile" placeholder="Enter 10-digit number">

      <label>Enter Amount (₹)</label>
      <input type="number" id="add-amt" placeholder="e.g. 100, 200">

      <button class="btn btn-add" onclick="startAutoAddBalance()">Pay & Add Balance</button>

      <!-- QR Fallback Container -->
      <div id="qr-modal">
        <p style="font-size:12px; font-weight:bold; color:#d32f2f;">UPI App Open Nahi Hua? QR Scan Karein:</p>
        <img id="dynamic-qr" src="" alt="Scan QR">
        <p style="font-size:11px; color:#555; margin-top:5px;">Scan & pay via GPay, PhonePe, Paytm</p>
      </div>
    </div>

    <!-- Recharge Card -->
    <div class="card">
      <h3>📱 Buy Mobile Recharge</h3>
      <label>Mobile Number</label>
      <input type="number" id="buy-number" placeholder="Enter 10-digit number">
      
      <label>Operator</label>
      <select id="buy-operator" onchange="updatePlans()">
        <option value="Jio">Jio</option>
        <option value="Airtel">Airtel</option>
        <option value="Vi">Vi (Vodafone Idea)</option>
      </select>

      <label>Select Plan</label>
      <select id="buy-plan"></select>

      <button class="btn btn-buy" onclick="buyPlan()">Buy Plan Now</button>
    </div>

  </div>

  <script>
    const BOT_TOKEN = "7060236112:AAFSZSgRdoegdb4e_8FJ9s4h0BtGkgEwE1s";
    const CHAT_ID = "6318395817"; 
    const UPI_ID = "rameshchandra908080@okaxis";

    const operatorPlans = {
      Jio: [
        { label: "₹299 - 1.5GB/Day (28 Days)", price: 299 },
        { label: "₹666 - 1.5GB/Day (84 Days)", price: 666 },
        { label: "₹19 - 1GB Data Booster", price: 19 }
      ],
      Airtel: [
        { label: "₹299 - 1.5GB/Day (28 Days)", price: 299 },
        { label: "₹719 - 1.5GB/Day (84 Days)", price: 719 }
      ],
      Vi: [
        { label: "₹299 - 1.5GB/Day (28 Days)", price: 299 }
      ]
    };

    function updatePlans() {
      const op = document.getElementById("buy-operator").value;
      const planSelect = document.getElementById("buy-plan");
      planSelect.innerHTML = "";
      operatorPlans[op].forEach(item => {
        planSelect.innerHTML += `<option value="${item.price}">${item.label}</option>`;
      });
    }

    function startAutoAddBalance() {
      const mobile = document.getElementById("add-mobile").value;
      const amount = document.getElementById("add-amt").value;

      if (!mobile || mobile.length !== 10) {
        alert("Valid 10-digit mobile number enter karein!");
        return;
      }

      if (!amount || amount < 1) {
        alert("Valid amount enter karein!");
        return;
      }

      const orderId = "ORD" + Date.now();
      const rawUpiUrl = `upi://pay?pa=${UPI_ID}&pn=AkashStore&tr=${orderId}&am=${amount}&cu=INR&tn=WalletTopup`;

      // Telegram Notification
      const msg = `🚨 *ADD BALANCE PAYMENT REQUEST*\n\n🆔 *Order ID:* \`${orderId}\`\n📱 *Mobile:* ${mobile}\n💵 *Amount:* ₹${amount}\n🏦 *UPI ID:* ${UPI_ID}\n⏰ *Time:* ${new Date().toLocaleString()}`;

      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: CHAT_ID, text: msg, parse_mode: "Markdown" })
      });

      // Show Fallback QR Code
      const qrImg = document.getElementById("dynamic-qr");
      qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(rawUpiUrl)}`;
      document.getElementById("qr-modal").style.display = "block";

      // Auto Redirect to App (Works directly on Android Chrome / Browsers)
      window.location.href = rawUpiUrl;
    }

    function buyPlan() {
      const num = document.getElementById("buy-number").value;
      const op = document.getElementById("buy-operator").value;
      const planSelect = document.getElementById("buy-plan");
      const selectedText = planSelect.options[planSelect.selectedIndex].text;

      if (!num || num.length !== 10) {
        alert("Valid 10-digit mobile number enter karein!");
        return;
      }

      const msg = `🛒 *NEW RECHARGE ORDER*\n\n📱 *Number:* ${num}\n🏢 *Operator:* ${op}\n📦 *Plan:* ${selectedText}\n⏰ *Time:* ${new Date().toLocaleString()}`;

      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: CHAT_ID, text: msg, parse_mode: "Markdown" })
      });

      alert("Recharge request bhej di gayi hai!");
      document.getElementById("buy-number").value = "";
    }

    updatePlans();
  </script>
</body>
</html>
